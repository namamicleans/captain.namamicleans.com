name: Deploy Captain to Dev

on:
  push:
    branches: [dev]
  workflow_dispatch: {}

jobs:
  deploy:
    name: Build and Deploy to Cloudflare Workers (dev)
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Build OpenNext Cloudflare bundle
        env:
          SERVER_URL: https://dev-api.namamicleans.com
          NEXT_PUBLIC_ANALYTICS_READY: ${{ secrets.NEXT_PUBLIC_ANALYTICS_READY }}
        run: npx opennextjs-cloudflare build

      - name: Deploy to Cloudflare Workers (dev)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env dev
